<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUBG Battle Royale</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;font-family:Arial;color:white}
.card{width:min(360px,85%);padding:28px;background:#222;border-radius:16px;text-align:center}
h1{font-size:24px}.note{font-size:12px;color:#ffc107;margin-bottom:20px}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:8px;border:0}
button{font-weight:bold;cursor:pointer}
#result{margin-top:12px;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>PUBG BATTLE ROYALE</h1>
<div class="note">FAN PAGE — DEMO ONLY</div>
<input id="email" placeholder="Demo email" autocomplete="off">
<input id="password" type="password" placeholder="Demo password" autocomplete="off">
<button onclick="showResult()">VERIFY</button>
<div id="result"></div>
</div>
<script>
function showResult(){
  const e=document.getElementById('email').value;
  const p=document.getElementById('password').value;
  document.getElementById('result').textContent =
    `Demo received: ${e ? 'email entered' : 'no email'} / ${p ? 'password entered' : 'no password'}. Nothing is saved or sent.`;
}
</script>
</body>
</html>
